name: tailscale
services:
  tailscale:
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cpu_shares: 90
    command: []
    container_name: tailscaled
    deploy:
      resources:
        limits:
          memory: 1921M
    environment:
      - TS_AUTH_ONCE=true
      - TS_AUTHKEY=[authkey]
      - TS_EXTRA_ARGS=--advertise-exit-node --advertise-routes [LAN]/24
        --accept-dns=false --accept-routes -ssh
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    hostname: tailscaled
    image: tailscale/tailscale:latest
    labels:
      icon: https://avatars.githubusercontent.com/u/48932923
    privileged: true
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/tailscale/var/lib
        target: /var/lib
      - type: bind
        source: /DATA/AppData/tailscale/dev/net/tun
        target: /dev/net/tun
      - type: bind
        source: /DATA/AppData/tailscale/var/lib/tailscale
        target: /var/lib/tailscale
    ports: []
    devices: []
    network_mode: host
x-casaos:
  author: self
  category: self
  hostname: ""
  icon: https://avatars.githubusercontent.com/u/48932923
  index: /
  is_uncontrolled: false
  port_map: ""
  scheme: http
  store_app_id: Tailscale
  title:
    custom: Tailscale
